name: Restore failed arts

# Manual only: puts every art in state/failed.json back into the queue (run it from the
# Actions tab). It shares the publisher's concurrency group, so the two never race.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-stories
  cancel-in-progress: false

jobs:
  requeue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install .
      - run: stories-requeue
      - name: Save the queue
        run: |
          git config user.name "stories-bot"
          git config user.email "stories-bot@users.noreply.github.com"
          for f in state/queue.json state/failed.json; do if [ -e "$f" ]; then git add "$f"; fi; done
          git diff --cached --quiet || (git commit -m "chore: restore failed arts to the queue" && (git push || (git pull --rebase && git push)))
