name: Publish Stories

on:
  schedule:
    # Fallback only: GitHub's own cron can run hours apart. The real trigger is an external
    # scheduler calling workflow_dispatch every few minutes (see docs/SETUP.pt-BR.md).
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write # to commit the queue and the publish record

concurrency:
  group: publish-stories
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Always the tip of the branch, so a re-run of an old run can still commit and push.
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install .
      - name: Receive arts sent to the Telegram bot
        # Never blocks publishing what is already queued.
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
        run: stories-inbox
      - name: Commit the queue
        # Saved before publishing so a crash never loses arts that were already uploaded.
        if: always()
        run: |
          git config user.name "stories-bot"
          git config user.email "stories-bot@users.noreply.github.com"
          for f in state/queue.json state/telegram.json; do if [ -e "$f" ]; then git add "$f"; fi; done
          git diff --cached --quiet || (git commit -m "chore: update Stories queue" && (git push || (git pull --rebase && git push)))
      - name: Publish the next Story
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_API: ${{ vars.IG_API }} # "instagram" for Instagram Login; empty for Page-linked
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: stories-bot
      - name: Save publish record
        if: always()
        run: |
          git config user.name "stories-bot"
          git config user.email "stories-bot@users.noreply.github.com"
          for f in state/posted.json state/queue.json state/failed.json state/alerts.json; do if [ -e "$f" ]; then git add "$f"; fi; done
          git diff --cached --quiet || (git commit -m "chore: record published stories" && (git push || (git pull --rebase && git push)))
